{% set path = current_path or "" %}
<header class="topbar">
  <nav class="topbar__nav" aria-label="Main">
    <a class="brand" href="{{ get_url(path='/') }}">{% include "partials/monogram.html" %}<span>{{ config.extra.author }}</span></a>
    <ul class="topbar__links">
      {% for item in config.extra.nav -%}
      <li><a href="{{ get_url(path=item.path, trailing_slash=true) }}"{% if item.path in path %} aria-current="page"{% endif %}>{{ item.label }}</a></li>
      {% endfor -%}
      <li class="topbar__divider" aria-hidden="true"></li>
            <li><a class="topbar__icon" href="{{ config.extra.github }}" rel="noopener noreferrer me" target="_blank" aria-label="GitHub" title="GitHub">{% include "partials/icon-github.html" %}</a></li>
      <li><a class="topbar__icon" href="{{ config.extra.linkedin }}" rel="noopener noreferrer me" target="_blank" aria-label="LinkedIn" title="LinkedIn">{% include "partials/icon-linkedin.html" %}</a></li>
    </ul>
  </nav>
  <div class="scroll-progress" aria-hidden="true"><div class="scroll-progress__bar" data-scroll-progress></div></div>
</header>
